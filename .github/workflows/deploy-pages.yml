name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp service worker build version
        run: |
          BUILD="${GITHUB_SHA::7}"
          # Scoped to the VERSION declaration only - a global replace would also
          # rewrite the dev-channel detection and make production behave as dev.
          sed -i "s|^const VERSION = '__BUILD__';|const VERSION = '${BUILD}';|" sw.js
          grep -n "const VERSION" sw.js
          if grep -q "__BUILD__" <<< "$(grep '^const VERSION' sw.js)"; then
            echo "::error::sw.js VERSION was not stamped"; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
