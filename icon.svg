<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Learn AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b52e6"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0e9c94"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: maskable icons may be cropped to a circle of r=205 -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- All glyph art lives inside the 80% maskable safe circle (center 256,256 r=205) -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- brain / network outline -->
    <path d="M256 150 L166 202 L166 306 L256 358 L346 306 L346 202 Z"/>
    <path d="M256 150 L256 236"/>
    <path d="M166 202 L256 236"/>
    <path d="M346 202 L256 236"/>
    <path d="M256 236 L200 300"/>
    <path d="M256 236 L312 300"/>
  </g>
  <g fill="#ffffff">
    <circle cx="256" cy="150" r="30"/>
    <circle cx="166" cy="202" r="26"/>
    <circle cx="346" cy="202" r="26"/>
    <circle cx="200" cy="300" r="26"/>
    <circle cx="312" cy="300" r="26"/>
    <circle cx="256" cy="358" r="26"/>
  </g>
  <circle cx="256" cy="236" r="34" fill="#37d6c6"/>
</svg>
